name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The syntax check does not need Electron or FFmpeg binaries, so skip install scripts.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
